# gitleaks: the default rules, plus one allowlisted path.
# The bundled password blocklist is a list of known-common passwords, not secrets, and its
# "password..." entries next to each other look like generic keys to the default rules.
[extend]
useDefault = true

[allowlist]
description = "Bundled common-password blocklist (generated by scripts/build-blocklist.ts)"
paths = ['''^apps/api/src/auth/blocklist/common-passwords\.json$''']
